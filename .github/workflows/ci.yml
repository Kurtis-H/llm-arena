name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  # Pipeline demo with the built-in fake models: proves every stage runs end to end.
  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: arena run suites/shopbot-security.toml --provider fake --generate 2 --md reports/security.md --out reports/security.json
      - run: arena run suites/shopbot-quality.toml --provider fake --md reports/quality.md
      - run: arena calibrate calibration/shopbot-judge.jsonl --provider fake --judge-model fake-judge --md reports/judge.md

  # Real model output, recorded on a GPU machine and committed under cassettes/.
  # Replaying is free, needs no GPU, and gives the same answers every time.
  replay:
    runs-on: ubuntu-latest
    needs: test
    if: hashFiles('cassettes/*.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Judge must agree with human labels
        if: hashFiles('cassettes/judge.json') != ''
        run: arena calibrate calibration/shopbot-judge.jsonl --replay cassettes/judge.json --judge-model qwen2.5:14b --repeat 3 --md reports/judge.md --min-accuracy 0.8
      - name: Security gate
        if: hashFiles('cassettes/security.json') != ''
        run: arena run suites/shopbot-security.toml --replay cassettes/security.json --md reports/security.md --max-asr 0.2
      - name: Quality gate
        if: hashFiles('cassettes/quality.json') != ''
        run: arena run suites/shopbot-quality.toml --replay cassettes/quality.json --md reports/quality.md --min-quality 0.8
