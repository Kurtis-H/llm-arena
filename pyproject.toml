[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-arena"
version = "0.1.0"
description = "Test AI with AI: attacker, target and judge models, plus calibration of the judge itself."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
arena = "llm_arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Markdown table templates and test fixtures read better on one line.
"src/llm_arena/report.py" = ["E501"]
"tests/*" = ["E501"]
